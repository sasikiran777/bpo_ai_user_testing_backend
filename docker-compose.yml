services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_testing}
      POSTGRES_USER: ${POSTGRES_USER:-ai_testing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_testing}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_testing}:${POSTGRES_PASSWORD:-ai_testing}@db:5432/${POSTGRES_DB:-ai_testing}?sslmode=disable
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    depends_on:
      - db

volumes:
  db_data:
